<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA94D"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9A2A00" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="200" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- fork: tines top-left -->
    <g transform="translate(512 500) rotate(-33)">
      <path d="M0 -110 V300" stroke-width="54"/>
      <path d="M-54 -320 V-190 a54 54 0 0 0 108 0 V-320" stroke-width="30"/>
      <path d="M0 -320 V-150" stroke-width="30"/>
    </g>
    <!-- knife: blade top-right -->
    <g transform="translate(512 500) rotate(33)">
      <path d="M0 60 V300" stroke-width="54"/>
      <path d="M-18 80 V-200 C-18 -272 8 -310 30 -316 V80 Z" fill="#fff" stroke-width="18"/>
    </g>
    <!-- plate -->
    <path d="M232 664 C300 702 372 718 512 718 C652 718 724 702 792 664" stroke-width="58"/>
  </g>
</svg>
