[package]
name = "appetizer"
version = "0.1.3"
description = "Free, open-source app launcher for great utility apps"
edition = "2021"

[lib]
name = "appetizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "process", "sync", "time", "macros"] }
futures-util = "0.3"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
